<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232445D8%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2217%22 fill=%22white%22 text-anchor=%22middle%22%3EG%3C/text%3E%3C/svg%3E">
<title>Glass Simulation</title>
<meta name="description" content="An interactive simulation of Glass on synthetic data: sources, quality, ontology, semantic layer, domain engines, agents, governance and outputs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed left rail that follows the data flow (bring in → give meaning → put to work → keep control), with a wide working canvas on the right. One deliberate light theme with royal blue as the only accent. */
:root {
  color-scheme: light;
  --bg: #F4F6FB;
  --surface: #FFFFFF;
  --sunken: #EEF1F8;
  --ink: #0D1530;
  --ink2: #38425F;
  --muted: #67708E;
  --faint: #9AA2BA;
  --line: #E2E6F1;
  --line2: #CFD5E6;
  --royal: #2445D8;
  --royal-d: #1A33A8;
  --royal-50: #EFF2FE;
  --royal-100: #DEE5FD;
  --royal-200: #BCC9FA;
  --good: #0F7F55; --good-bg: #E5F4EC;
  --warn: #9A5B00; --warn-bg: #FCF1DC;
  --bad: #BD2C38; --bad-bg: #FBE9EA;
  --unk: #545A82; --unk-bg: #ECEDF5;
  --sans: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 14px; --r-s: 9px;
  --shadow: 0 1px 2px rgba(13,21,48,.05), 0 6px 20px -10px rgba(13,21,48,.12);
  --shadow-lg: 0 24px 60px -20px rgba(13,21,48,.28);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--royal); }
:focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Shell */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100dvh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--royal); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.brand-tag { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--royal); background: var(--royal-50); border-radius: 999px; padding: 3px 8px; }
.company { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; display: grid; gap: 2px; background: var(--bg); }
.company b { font-size: 13.5px; }
.company span { font-size: 12px; color: var(--muted); }
.nav { display: grid; gap: 14px; }
.nav-group { display: grid; gap: 2px; }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 0 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; border: 0; background: none; text-align: left; font-weight: 600; color: var(--ink2); font-size: 13.5px; text-decoration: none; }
.nav-item svg { flex: none; color: var(--muted); }
.nav-item:hover { background: var(--sunken); }
.nav-item.active { background: var(--royal-50); color: var(--royal-d); }
.nav-item.active svg { color: var(--royal); }
.nav-item .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 1px 7px; }
.rail-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 4px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 32px; background: rgba(244,246,251,.86); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.crumb { font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(15,127,85,.5); animation: pulse 2s infinite; }
.live.stopped i { background: var(--bad); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15,127,85,.45); } 70% { box-shadow: 0 0 0 7px rgba(15,127,85,0); } 100% { box-shadow: 0 0 0 0 rgba(15,127,85,0); } }
.sim-pill { font-size: 12px; font-weight: 700; color: var(--unk); background: var(--unk-bg); border-radius: 999px; padding: 5px 11px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); padding: 8px 14px; font-weight: 700; font-size: 13px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--royal-200); background: var(--royal-50); }
.btn.primary { background: var(--royal); border-color: var(--royal); color: #fff; }
.btn.primary:hover { background: var(--royal-d); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: none; color: var(--royal); }
.btn.ghost:hover { background: var(--royal-50); }
.btn.danger { color: var(--bad); border-color: #EFC3C7; }
.btn.danger:hover { background: var(--bad-bg); }
.btn[disabled] { opacity: .5; cursor: default; }

#view { padding: 28px 32px 56px; display: grid; gap: 22px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.page-head > div:first-child { min-width: 0; flex: 1 1 420px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--royal); margin-bottom: 6px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
.lede { color: var(--ink2); font-size: 15px; max-width: 74ch; margin-top: 8px; }
h2 { font-size: 17px; font-weight: 800; }
h3 { font-size: 14.5px; font-weight: 800; }
.sub { color: var(--muted); font-size: 13px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.card-h .sub { margin-left: auto; }
.card-b { padding: 16px 18px 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }

/* Pills and states */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.ok { color: var(--good); background: var(--good-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }
.unk { color: var(--unk); background: var(--unk-bg); }
.blue { color: var(--royal-d); background: var(--royal-50); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; color: var(--ink2); white-space: nowrap; }
.chip.blue { border-color: var(--royal-100); }
.chip.no { color: var(--bad); border-color: #F0CBCE; background: var(--bad-bg); text-decoration: line-through; text-decoration-color: rgba(189,44,56,.45); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tier { display: inline-grid; place-items: center; min-width: 54px; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px; letter-spacing: .02em; }
.tier.t0 { color: var(--good); background: var(--good-bg); }
.tier.t1 { color: var(--royal-d); background: var(--royal-50); }
.tier.t2 { color: var(--warn); background: var(--warn-bg); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; box-shadow: var(--shadow); min-width: 0; }
.kpi .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.accent { background: var(--royal); border-color: var(--royal); }
.kpi.accent .k, .kpi.accent .d { color: #CBD6FF; }
.kpi.accent .v { color: #fff; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--royal-50); }
.tbl .r { text-align: right; }

/* Tabs */
.tabs { display: inline-flex; gap: 4px; background: var(--sunken); border-radius: 11px; padding: 4px; flex-wrap: wrap; }
.tab { border: 0; background: none; border-radius: 8px; padding: 7px 14px; font-weight: 700; font-size: 13px; color: var(--ink2); }
.tab.active { background: var(--surface); color: var(--royal-d); box-shadow: 0 1px 3px rgba(13,21,48,.1); }

/* Overview flow */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; position: relative; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; margin-right: 26px; text-align: left; display: grid; gap: 6px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.stage:last-child { margin-right: 0; }
.stage:hover { border-color: var(--royal-200); transform: translateY(-2px); }
.stage::after { content: ""; position: absolute; right: -22px; top: 50%; width: 18px; height: 2px; background: var(--royal-200); }
.stage::before { content: ""; position: absolute; right: -24px; top: calc(50% - 4px); border: 5px solid transparent; border-left: 6px solid var(--royal-200); }
.stage:last-child::after, .stage:last-child::before { display: none; }
.stage .s-n { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--royal); }
.stage .s-t { font-size: 15px; font-weight: 800; }
.stage .s-v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stage .s-d { font-size: 12px; color: var(--muted); line-height: 1.4; }
.stage.dark { background: var(--royal); border-color: var(--royal); }
.stage.dark .s-n { color: #C3CFFF; } .stage.dark .s-t, .stage.dark .s-v { color: #fff; } .stage.dark .s-d { color: #D7DFFF; }
.pipe { position: relative; height: 6px; margin: 14px 0 2px; border-radius: 999px; background: linear-gradient(90deg, var(--royal-100), var(--royal-200)); overflow: hidden; }
.pipe i { position: absolute; top: 0; left: -8%; width: 8%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, transparent, var(--royal), transparent); animation: flow 5.5s linear infinite; }
.pipe i:nth-child(2) { animation-delay: 1.4s; } .pipe i:nth-child(3) { animation-delay: 2.8s; } .pipe i:nth-child(4) { animation-delay: 4.1s; }
@keyframes flow { to { left: 100%; } }
.pipe-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-weight: 700; }

/* Feeds and lists */
.feed { display: grid; max-height: 384px; overflow: auto; }
.feed-row { display: grid; grid-template-columns: 66px 106px minmax(0, 1fr); gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: start; }
.feed-row:last-child { border-bottom: 0; }
.feed-row .t { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 1px; }
.feed-row .w { font-size: 11.5px; font-weight: 800; color: var(--royal-d); }
.feed-row.bad .w { color: var(--bad); } .feed-row.warn .w { color: var(--warn); }
.feed-row.new { animation: slidein .5s ease; }
@keyframes slidein { from { background: var(--royal-50); } to { background: transparent; } }
.attn { display: grid; gap: 10px; }
.attn-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); text-align: left; width: 100%; }
.attn-row:hover { border-color: var(--royal-200); }
.attn-row .stripe { align-self: stretch; border-radius: 11px 0 0 11px; }
.stripe.ok { background: var(--good); } .stripe.warn { background: #E2A23B; } .stripe.bad { background: var(--bad); } .stripe.unk { background: var(--unk); } .stripe.blue { background: var(--royal); }
.attn-row b { display: block; font-size: 13.5px; }
.attn-row span { font-size: 12.5px; color: var(--muted); }

.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: 13px; }
.hbar .track { height: 10px; background: var(--sunken); border-radius: 999px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--royal); border-radius: 999px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink2); }
.hbar .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sources */
.src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.src { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; min-width: 0; }
.src:hover { border-color: var(--royal-200); transform: translateY(-2px); }
.src-top { display: flex; gap: 12px; align-items: flex-start; }
.src-ic { width: 40px; height: 40px; border-radius: 11px; background: var(--royal-50); color: var(--royal); display: grid; place-items: center; flex: none; }
.src-top > div { min-width: 0; flex: 1; }
.src-top b { display: block; font-size: 14.5px; }
.src-top span { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.src-stats div { display: grid; gap: 1px; min-width: 0; }
.src-stats small { font-size: 11px; color: var(--muted); font-weight: 700; }
.src-stats strong { font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.src.add { border-style: dashed; box-shadow: none; background: transparent; align-content: start; }

/* Quality */
.gates { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.gate { border: 1px solid var(--line); border-radius: 11px; padding: 10px; background: var(--surface); display: grid; gap: 4px; min-width: 0; transition: all .25s; }
.gate small { font-size: 10.5px; font-weight: 800; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.gate b { font-size: 12.5px; line-height: 1.3; }
.gate span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.gate.pass { border-color: #A9DCC3; background: var(--good-bg); }
.gate.fail { border-color: #EFB9BE; background: var(--bad-bg); }
.gate.skip { opacity: .45; }
.gate.on { box-shadow: 0 0 0 3px var(--royal-100); }
.issue { display: grid; grid-template-columns: 4px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.issue-b { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.issue-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.issue-h .mono { color: var(--faint); }
.issue-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); }
.issue-meta b { color: var(--ink2); font-weight: 700; }
.issue-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.glass-says { font-size: 13px; color: var(--ink2); background: var(--sunken); border-radius: 9px; padding: 8px 11px; }
.glass-says b { color: var(--royal-d); }

/* Ontology */
.onto { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.ent-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; }
.ent-b > div { display: grid; gap: 16px; align-content: start; min-width: 0; }
.graph-wrap { overflow-x: auto; }
.graph { width: 100%; min-width: 620px; height: auto; display: block; }
.graph .edge { stroke: var(--line2); stroke-width: 1.6; fill: none; }
.graph .edge.hot { stroke: var(--royal); stroke-width: 2.2; }
.graph .elabel { font-size: 12.5px; fill: var(--muted); font-family: var(--sans); font-weight: 600; }
.graph .elabel.hot { fill: var(--royal-d); }
.graph .node { cursor: pointer; }
.graph .node rect { stroke-width: 1.4; }
.graph .node text { font-family: var(--sans); }
.graph .node .nm { font-size: 15.5px; font-weight: 800; fill: var(--ink); }
.graph .node .ct { font-size: 12.5px; font-weight: 600; fill: var(--muted); }
.graph .node.g1 rect { fill: var(--royal-50); stroke: var(--royal-200); }
.graph .node.g2 rect { fill: var(--surface); stroke: var(--line2); }
.graph .node.g3 rect { fill: var(--sunken); stroke: var(--line2); }
.graph .node:hover rect { stroke: var(--royal); }
.graph .node.sel rect { fill: var(--royal); stroke: var(--royal); }
.graph .node.sel .nm, .graph .node.sel .ct { fill: #fff; }
.graph .node.dim .nm, .graph .node.dim .ct { fill: var(--faint); }
.graph .node.dim rect { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line2); }
.attr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.attr:last-child { border-bottom: 0; }
.attr .src-tag { font-size: 11px; color: var(--muted); grid-column: 1 / -1; }
.golden { display: grid; grid-template-columns: 150px repeat(4, minmax(130px, 1fr)) minmax(170px, 1.3fr); min-width: 960px; font-size: 12.5px; }
.golden > div { padding: 9px 10px; border-bottom: 1px solid var(--line); }
.golden .gh { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--sunken); }
.golden .gf { font-weight: 700; color: var(--ink2); }
.golden .pick { background: var(--royal-50); color: var(--royal-d); font-weight: 700; }
.golden .res { font-weight: 700; }
.golden .why { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.golden .na { color: var(--faint); }

/* Semantic */
.sem { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.deflist { display: grid; gap: 14px; }
.defgrp small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 0 10px 4px; }
.defitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; border-radius: 9px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.defitem:hover { background: var(--sunken); }
.defitem.active { background: var(--royal-50); color: var(--royal-d); }
.defitem svg { margin-left: auto; color: var(--good); flex: none; }
.formula { font-family: var(--mono); font-size: 12.5px; background: #0E1838; color: #DCE3FF; border-radius: 11px; padding: 14px 16px; line-height: 1.7; overflow-x: auto; white-space: pre; }
.formula .k { color: #8FA6FF; } .formula .c { color: #7F8AB3; } .formula .s { color: #9BE0BD; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; min-width: 0; }
.versions { display: grid; gap: 0; }
.ver { display: grid; grid-template-columns: 44px 92px minmax(0, 1fr); gap: 10px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.ver:last-child { border-bottom: 0; }
.legible { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.code { font-family: var(--mono); font-size: 12px; line-height: 1.65; background: var(--sunken); border: 1px solid var(--line); border-radius: 11px; padding: 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink2); max-height: 440px; }
.code.dark { background: #0E1838; color: #DCE3FF; border-color: #0E1838; }
.code .k { color: var(--royal); font-weight: 500; } .code.dark .k { color: #8FA6FF; }
.code .s { color: #0F7F55; } .code.dark .s { color: #9BE0BD; }
.code .c { color: var(--faint); } .code.dark .c { color: #7F8AB3; }
.code .err { color: var(--bad); }
.steps { display: grid; gap: 0; counter-reset: st; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 10px 0; position: relative; }
.step::before { counter-increment: st; content: counter(st); width: 26px; height: 26px; border-radius: 50%; background: var(--royal-50); color: var(--royal-d); font-weight: 800; font-size: 12px; display: grid; place-items: center; }
.step::after { content: ""; position: absolute; left: 12.5px; top: 38px; bottom: -8px; width: 1px; background: var(--line2); }
.step:last-child::after { display: none; }
.step b { display: block; font-size: 13.5px; }
.step span { font-size: 13px; color: var(--ink2); }

/* Engines */
.anatomy { display: grid; gap: 10px; }
.anat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.anat { border: 1px solid var(--royal-100); background: var(--royal-50); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.anat b { font-size: 13.5px; color: var(--royal-d); }
.anat span { font-size: 12.5px; color: var(--ink2); line-height: 1.4; }
.anat-base { border-radius: 12px; background: var(--royal); color: #fff; padding: 12px 16px; display: flex; gap: 10px 24px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.anat-base b { font-size: 14px; }
.anat-base span { color: #D7DFFF; }
.eng-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.eng { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; box-shadow: var(--shadow); align-content: start; transition: border-color .15s; }
.eng:hover { border-color: var(--royal-200); }
.eng.active { border-color: var(--royal); box-shadow: 0 0 0 3px var(--royal-100), var(--shadow); }
.eng b { font-size: 15px; }
.eng p { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.eng-stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.eng-stats strong { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; opacity: .32; transition: opacity .35s; }
.tl.on { opacity: 1; }
.tl::after { content: ""; position: absolute; left: 15.5px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::after { display: none; }
.tl .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--muted); border: 1px solid var(--line2); }
.tl.on .dot { background: var(--royal); color: #fff; border-color: var(--royal); }
.tl.on.gate-step .dot { background: #0E1838; border-color: #0E1838; }
.tl.on.person .dot { background: #E2A23B; border-color: #E2A23B; }
.tl-b { display: grid; gap: 4px; padding-top: 4px; min-width: 0; }
.tl-b .who { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--royal); }
.tl.gate-step .who { color: #0E1838; } .tl.person .who { color: var(--warn); }
.tl-b b { font-size: 13.5px; }
.tl-b span { font-size: 13px; color: var(--ink2); }
.tl-b .chips { margin-top: 4px; }

/* Agents */
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.agent { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); transition: border-color .15s; }
.agent:hover { border-color: var(--royal-200); }
.agent.active { border-color: var(--royal); box-shadow: 0 0 0 3px var(--royal-100), var(--shadow); }
.agent-top { display: flex; gap: 10px; align-items: center; }
.av { width: 36px; height: 36px; border-radius: 10px; background: var(--royal); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.av.alt { background: #0E1838; }
.agent-top .av, .client .av { color: #fff; font-size: 12px; }
.agent-top b { display: block; font-size: 14px; line-height: 1.25; }
.agent-top span { font-size: 12px; color: var(--muted); }
.agent-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; gap: 8px; }
.agent-meta strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 560px; }
.chat-log { overflow-y: auto; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 88%; border-radius: 14px; padding: 10px 13px; font-size: 13.5px; line-height: 1.5; }
.msg.me { justify-self: end; background: var(--royal); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { justify-self: start; background: var(--sunken); border-bottom-left-radius: 4px; }
.msg.ai.refuse { background: var(--bad-bg); color: #7A1C25; }
.msg .cites { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.msg .cite { font-size: 11px; font-weight: 700; color: var(--royal-d); background: var(--surface); border: 1px solid var(--royal-100); border-radius: 6px; padding: 1px 7px; }
.msg .trace { margin-top: 8px; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.prompts { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.prompt { border: 1px solid var(--royal-100); background: var(--royal-50); color: var(--royal-d); font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 6px 12px; }
.prompt:hover { border-color: var(--royal-200); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bob 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

/* Governance */
.donut-wrap { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; align-items: center; }
.dl { display: grid; gap: 10px; }
.dl-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.dl-row i { width: 12px; height: 12px; border-radius: 4px; }
.dl-row strong { font-variant-numeric: tabular-nums; }
.dl-row span { display: block; font-size: 12px; color: var(--muted); }
.chain { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.blk { flex: none; width: 150px; border: 1px solid var(--line); border-radius: 11px; padding: 10px; background: var(--surface); display: grid; gap: 3px; font-size: 11.5px; transition: all .25s; }
.blk b { font-size: 12px; }
.blk .mono { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk.ok { border-color: #A9DCC3; background: var(--good-bg); }
.stop-card { border: 1px solid #EFC3C7; background: linear-gradient(0deg, var(--surface), var(--surface)); }
.banner { border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 13.5px; flex-wrap: wrap; }
.banner.bad { background: var(--bad-bg); color: #7A1C25; border: 1px solid #EFC3C7; }
.confirm { display: grid; gap: 10px; border: 1px solid var(--line2); border-radius: 11px; padding: 12px; background: var(--bg); }

/* Outputs */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.app-tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.app-tile:hover { border-color: var(--royal-200); transform: translateY(-2px); }
.app-prev { background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px; height: 140px; }
.app-body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.app-body b { font-size: 14.5px; }
.app-body p { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.ep { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 9px; font-family: var(--mono); font-size: 12.5px; color: var(--ink2); }
.ep:hover { background: var(--sunken); }
.ep.active { background: var(--royal-50); color: var(--royal-d); }
.method { font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 2px 0; text-align: center; font-family: var(--mono); }
.method.get { background: var(--good-bg); color: var(--good); }
.method.post { background: var(--royal-50); color: var(--royal-d); border: 1px solid var(--royal-100); }
.tool-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; }
.tool-row:last-child { border-bottom: 0; }
.tool-row .mono { color: var(--royal-d); font-weight: 500; }
.client { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.client:last-child { border-bottom: 0; }
.client .av { width: 30px; height: 30px; font-size: 11px; border-radius: 8px; }
.client > div { min-width: 0; flex: 1; }
.client b { display: block; }
.client span { color: var(--muted); font-size: 12px; }
.mcp-log { display: grid; gap: 10px; }
.mcp-turn { display: grid; gap: 6px; }
.mcp-turn .role { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mcp-call { font-family: var(--mono); font-size: 12px; background: #0E1838; color: #DCE3FF; border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.mcp-call .k { color: #8FA6FF; } .mcp-call .s { color: #9BE0BD; } .mcp-call .err { color: #FF9AA3; }
.mcp-text { font-size: 13.5px; background: var(--sunken); border-radius: 10px; padding: 10px 12px; }

/* Drawer, tour, toast */
.scrim { position: fixed; inset: 0; background: rgba(13,21,48,.32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); z-index: 41; background: var(--surface); box-shadow: var(--shadow-lg); transform: translateX(104%); transition: transform .25s ease; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.drawer-h > div { min-width: 0; flex: 1; }
.drawer-h h2 { font-size: 19px; }
.drawer-b { overflow-y: auto; padding: 18px 22px 40px; display: grid; gap: 18px; align-content: start; }
.x { border: 0; background: var(--sunken); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.x:hover { background: var(--royal-50); color: var(--royal); }
.section-t { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.tour { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 45; width: min(380px, calc(100vw - 32px)); background: #0E1838; color: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); padding: 16px 18px; display: grid; gap: 10px; }
.tour small { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #8FA6FF; }
.tour b { font-size: 15.5px; }
.tour p { font-size: 13.5px; color: #D5DCF5; line-height: 1.5; }
.tour-nav { display: flex; gap: 8px; align-items: center; }
.tour-nav .dots { display: flex; gap: 4px; margin-right: auto; }
.tour-nav .dots i { width: 6px; height: 6px; border-radius: 50%; background: #3A4878; }
.tour-nav .dots i.on { background: #8FA6FF; }
.tour .btn { background: transparent; color: #fff; border-color: #3A4878; }
.tour .btn:hover { background: #1B2752; }
.tour .btn.primary { background: var(--royal); border-color: var(--royal); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 50; background: #0E1838; color: #fff; font-weight: 600; font-size: 13.5px; border-radius: 12px; padding: 10px 16px; transition: all .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.foot-note { font-size: 12px; color: var(--faint); text-align: center; padding-top: 6px; }

/* How it comes together */
.fx-card { overflow: hidden; }
.fx-top { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.fx-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.fx-step { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; font-size: 12.5px; color: var(--ink2); }
.fx-step i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--royal-50); color: var(--royal-d); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.fx-step:hover { border-color: var(--royal-200); }
.fx-step.active { background: var(--royal); border-color: var(--royal); color: #fff; }
.fx-step.active i { background: #fff; color: var(--royal); }
.fx-ctl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.fx-caption { display: flex; gap: 14px; align-items: center; padding: 12px 18px; background: var(--royal-50); border-bottom: 1px solid var(--royal-100); font-size: 14px; color: var(--ink); min-height: 50px; }
.fx-caption b { color: var(--royal-d); white-space: nowrap; }
.fx-counts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.fx-counts div { padding: 10px 18px; display: grid; gap: 1px; border-right: 1px solid var(--line); min-width: 0; }
.fx-counts div:last-child { border-right: 0; }
.fx-counts small { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx-counts strong { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.fx-wrap { overflow-x: auto; background: linear-gradient(180deg, var(--surface), var(--bg)); }
.fx-svg { display: block; width: 100%; min-width: 1080px; height: auto; font-family: var(--sans); }
.fx-svg text { font-family: var(--sans); }
.fx-head { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; fill: var(--royal); }
.fx-headsub { font-size: 11.5px; fill: var(--muted); font-weight: 600; }
.fx-grp { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; fill: var(--faint); }
.fx-frame { fill: var(--royal-50); stroke: var(--royal-100); stroke-width: 1.2; }
.fx-frame.sem { fill: #E8EDFF; stroke: var(--royal-200); }
.fx-gate { fill: url(#gateGrad); stroke: var(--royal-200); stroke-width: 1.2; }
.fx-tray { fill: var(--bad-bg); stroke: #EFC3C7; stroke-width: 1.2; }
.fx-node { cursor: pointer; transition: opacity .2s; }
.fx-node rect { transition: fill .25s, stroke .25s; }
.fx-src rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.2; }
.fx-src.out rect { fill: #F2F8FE; stroke: #B9DAF4; }
.fx-src .t1 { font-size: 14px; font-weight: 700; fill: var(--ink); }
.fx-src .t2 { font-size: 11px; font-weight: 600; fill: var(--muted); }
.fx-src .dot { fill: var(--royal); }
.fx-src.out .dot { fill: #3AA0E8; }
.fx-ent rect { fill: var(--surface); stroke: var(--royal-200); stroke-width: 1.4; }
.fx-ent text { font-size: 14.5px; font-weight: 800; fill: var(--ink); }
.fx-ent .cnt { font-size: 11px; font-weight: 600; fill: var(--muted); }
.fx-ent.pulse rect { fill: var(--royal-100); stroke: var(--royal); }
.fx-ent.merged rect { fill: var(--royal); stroke: var(--royal); }
.fx-ent.merged text { fill: #fff; }
.fx-rel { stroke: var(--royal-200); stroke-width: 1.4; fill: none; }
.fx-rel-l { font-size: 11px; font-weight: 700; fill: var(--royal-d); opacity: .75; paint-order: stroke; stroke: var(--royal-50); stroke-width: 4px; }
.fx-def rect { fill: var(--surface); stroke: var(--royal); stroke-width: 1.4; }
.fx-def text { font-size: 13px; font-weight: 800; fill: var(--royal-d); }
.fx-def .ver { font-size: 10.5px; font-weight: 700; fill: var(--good); }
.fx-def.pulse rect { fill: var(--royal-100); }
.fx-use rect { fill: #0E1838; stroke: #0E1838; }
.fx-use text { font-size: 14px; font-weight: 800; fill: #fff; }
.fx-use .t2 { font-size: 11px; font-weight: 600; fill: #AFBCEB; }
.fx-use.pulse rect { fill: var(--royal); stroke: var(--royal); }
.fx-path { fill: none; stroke: var(--royal-100); stroke-width: 1.3; transition: opacity .2s, stroke .2s; }
.fx-path.out { stroke: #CDE6F8; }
.fx-path.ed { stroke-dasharray: 3 4; stroke: var(--royal-200); }
.fx-path.du { stroke: #C9D1EA; }
.fx-svg.dim .fx-node:not(.hl) { opacity: .2; }
.fx-svg.dim .fx-path:not(.hl), .fx-svg.dim .fx-rel:not(.hl), .fx-svg.dim .fx-rel-l:not(.hl) { opacity: .08; }
.fx-svg .fx-path.hl { stroke: var(--royal); stroke-width: 2.2; opacity: 1; }
.fx-svg .fx-path.out.hl { stroke: #3AA0E8; }
.fx-svg .fx-rel.hl { stroke: var(--royal); stroke-width: 2.2; }
.fx-svg.dim .fx-node.hl rect { stroke-width: 2.2; }
.fx-svg .col { transition: opacity .3s; }
.fx-svg.focusing .col:not(.focus) { opacity: .28; }
.fx-svg.dim.focusing .col:not(.focus) { opacity: 1; }
.fx-rel-l.curve { opacity: 0; }
.fx-svg .fx-rel-l.curve.hl { opacity: 1; }
.fx-info > div > .pill, .fx-info > div > .chip { justify-self: start; }
.fx-chip rect { fill: var(--royal); }
.fx-chip.out rect { fill: #3AA0E8; }
.fx-chip.bad rect { fill: var(--bad); }
.fx-chip text { font-family: var(--mono); font-size: 10px; fill: #fff; font-weight: 500; }
.fx-call rect { fill: #0E1838; }
.fx-call text { fill: #fff; }
.fx-legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); font-weight: 600; align-items: center; }
.fx-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.fx-info { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }

  #view.enter .steps.play .step:nth-child(2) { animation-delay: .45s; } #view.enter .steps.play .step:nth-child(3) { animation-delay: .9s; } #view.enter .steps.play .step:nth-child(4) { animation-delay: 1.35s; }
  #view.enter .tokbar i { transform-origin: left center; animation: grow 1.2s .5s cubic-bezier(.2,.7,.2,1) both; }
}

/* Theatre: watch the agents resolve a problem */
.th { display: grid; grid-template-columns: 300px minmax(0, 1fr); border-top: 1px solid var(--line); margin-top: 14px; }
.th-pick { border-right: 1px solid var(--line); padding: 12px; display: grid; gap: 4px; align-content: start; }
.th-it { display: grid; grid-template-columns: 34px minmax(0, 1fr) 10px; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: 11px; padding: 8px; width: 100%; }
.th-it:hover { background: var(--sunken); }
.th-it.active { background: var(--royal-50); border-color: var(--royal-100); }
.th-it b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; line-height: 1.3; }
.th-it small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 1px; }
.kic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; transition: background .3s, color .3s; }
.kic.bad { background: var(--bad-bg); color: var(--bad); } .kic.warn { background: var(--warn-bg); color: var(--warn); }
.kic.blue { background: var(--royal-50); color: var(--royal); } .kic.done { background: var(--good-bg); color: var(--good); } .kic.unk { background: var(--unk-bg); color: var(--unk); }
.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
.sdot.open { background: #E2A23B; } .sdot.wait { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); } .sdot.done { background: var(--good); } .sdot.run { background: var(--royal); animation: ping 1.1s infinite; }
.th-stage { padding: 18px 22px 20px; display: grid; gap: 16px; min-width: 0; background: linear-gradient(180deg, var(--surface), var(--bg)); border-radius: 0 0 var(--r) 0; }
.th-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.th-ctl .sub { margin-right: auto; }
.thtrack { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 36px; }
.thtrack::before { content: ""; position: absolute; left: 10%; right: 10%; top: 57px; height: 3px; background: var(--line); border-radius: 3px; }
.thtrack .prog { position: absolute; left: 10%; top: 57px; height: 3px; background: var(--royal); border-radius: 3px; transition: width .7s cubic-bezier(.2,.7,.2,1); }
.thtrack .tok { position: absolute; top: 2px; width: 22px; height: 26px; border-radius: 5px; background: var(--surface); border: 1.5px solid var(--royal); color: var(--royal); display: grid; place-items: center; transform: translateX(-50%); transition: left .7s cubic-bezier(.2,.7,.2,1); box-shadow: var(--shadow); z-index: 2; animation: hop 1.1s ease-in-out infinite; }
.thtrack .tok.fin { border-color: var(--good); color: var(--good); animation: none; }
.thtrack .tok.wait { border-color: #E2A23B; color: var(--warn); animation: none; }
.stn { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; z-index: 1; }
.stn .a2 { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line2); color: var(--faint); display: grid; place-items: center; transition: all .35s; }
.stn b { font-size: 12px; margin-top: 4px; }
.stn span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.stn.todo b { color: var(--faint); }
.stn.done .a2, .stn.now .a2 { background: var(--royal); border-color: var(--royal); color: #fff; }
.stn.now .a2 { animation: ping 1.1s infinite; }
.stn.gw.done .a2, .stn.gw.now .a2 { background: #0E1838; border-color: #0E1838; }
.stn.person.now .a2, .stn.person.done .a2 { background: #E2A23B; border-color: #E2A23B; }
.stn.person.now .a2 { animation: pingw 1.1s infinite; }
.stn.fin.done .a2 { background: var(--good); border-color: var(--good); }
.paper { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 10px; overflow: hidden; transition: border-color .4s, box-shadow .4s; }
.paper.fin { border-color: #A9DCC3; box-shadow: 0 0 0 4px var(--good-bg), var(--shadow); }
.paper.wait { border-color: #F0D29C; box-shadow: 0 0 0 4px var(--warn-bg), var(--shadow); }
.paper-h { display: flex; align-items: center; gap: 12px; }
.paper-h > div { min-width: 0; flex: 1; }
.paper-h b { display: block; font-size: 14px; line-height: 1.3; }
.paper-h small { font-size: 12px; color: var(--muted); }
.pi { width: 34px; height: 42px; border-radius: 6px 12px 6px 6px; background: var(--royal-50); color: var(--royal); display: grid; place-items: center; flex: none; border: 1px solid var(--royal-100); }
.skel { height: 7px; border-radius: 6px; background: var(--sunken); }
.ln { border-radius: 10px; padding: 9px 12px; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13.5px; line-height: 1.45; }
.ln small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.ln.before { background: var(--bad-bg); color: #7A1C25; }
.ln.before.struck > span:last-child > span { text-decoration: line-through; text-decoration-color: rgba(189,44,56,.55); opacity: .75; }
.ln.after { background: var(--royal-50); border: 1px dashed var(--royal-200); color: var(--ink); animation: typein .6s ease both; }
.ln.after small { color: var(--royal-d); }
.ln.after.fin { background: var(--good-bg); border: 1px solid #A9DCC3; animation: none; }
.ln.after.fin small { color: var(--good); }
.ln.after.wait { background: var(--warn-bg); border: 1px dashed #E8B45C; animation: none; }
.ln.after.wait small { color: var(--warn); }
.ln svg { margin-top: 2px; }
.qq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qq div { border-left: 3px solid var(--bad); background: var(--bad-bg); border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 12.5px; }
.qq small { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.qq.fin div { border-left-color: var(--good); background: var(--good-bg); }
.scanbar { position: absolute; left: 0; right: 0; top: 0; height: 32%; background: linear-gradient(180deg, transparent, rgba(36,69,216,.14), transparent); animation: scan 1.15s ease-in-out both; pointer-events: none; }
.stamps { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 28px; }
.stamp { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; border: 2px solid currentColor; border-radius: 7px; padding: 3px 8px; transform: rotate(-4deg); background: rgba(255,255,255,.9); animation: stampin .38s cubic-bezier(.2,1.6,.4,1) both; }
.stamp.v, .stamp.t0 { color: var(--good); } .stamp.t1 { color: var(--royal-d); } .stamp.t2 { color: var(--warn); } .stamp.rec { color: #0E1838; }
.paper-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.paper-act .sub { flex: 1; }
.say { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 52px; animation: fadein .35s both; }
.say .av { width: 30px; height: 30px; font-size: 10.5px; border-radius: 9px; }
.say .av.amber { background: #E2A23B; } .say .av.green { background: var(--good); }
.say b { color: var(--royal-d); }
.th-log { margin-top: 2px; }
.th-log summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--royal-d); padding: 6px 0; }
.th-log .ag-log { max-height: 260px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.bcol { background: var(--sunken); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 140px; min-width: 0; }
.bcol-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px; font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.bcol-h i { width: 8px; height: 8px; border-radius: 50%; }
.bcol-h .n { margin-left: auto; font-size: 12px; letter-spacing: 0; color: var(--ink); background: var(--surface); border-radius: 999px; padding: 1px 9px; }
.col-empty { font-size: 12.5px; color: var(--faint); text-align: center; padding: 18px 8px; border: 1px dashed var(--line2); border-radius: 11px; }
.bd { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: grid; gap: 8px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; min-width: 0; }
.bd:hover { transform: translateY(-2px); border-color: var(--royal-200); }
.bd:focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; }
.bd-top { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.bd-top .kic { width: 28px; height: 28px; border-radius: 8px; }
.bd-top .mono { color: var(--faint); font-size: 11.5px; }
.bd b { font-size: 13px; line-height: 1.35; }
.bd-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bd-now { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; font-size: 12px; color: var(--good); font-weight: 600; line-height: 1.4; background: var(--good-bg); border-radius: 8px; padding: 6px 8px; }
.bd.landed { animation: land .75s cubic-bezier(.2,.8,.2,1) both; }
.by { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.by.agents { color: var(--good); background: var(--good-bg); } .by.owner { color: var(--royal-d); background: var(--royal-50); }
.by.wait { color: var(--warn); background: var(--warn-bg); } .by.dis { color: var(--unk); background: var(--unk-bg); } .by.next { color: var(--muted); background: var(--sunken); }
.bd .btn.sm { margin-left: auto; padding: 3px 9px; }

/* History */
.hist { display: grid; }
.hrow { display: grid; grid-template-columns: 92px 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow .when { font-family: var(--mono); font-size: 11px; color: var(--faint); line-height: 1.35; }
.hrow .kic { width: 32px; height: 32px; border-radius: 9px; }
.hrow b { font-size: 13px; display: block; }
.bf { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; flex-wrap: wrap; margin-top: 2px; }
.bf s { color: var(--bad); text-decoration-color: rgba(189,44,56,.5); }
.bf em { font-style: normal; color: var(--good); font-weight: 700; }
.bf svg { color: var(--faint); flex: none; }
.hrow .who { display: grid; justify-items: end; gap: 4px; }
.avs { display: flex; }
.avs .av { width: 22px; height: 22px; font-size: 9px; border-radius: 7px; border: 2px solid var(--surface); margin-left: -5px; }
.avs .av:first-child { margin-left: 0; }

/* Rails ladder */
.ladder { display: grid; gap: 12px; }
.rung { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; align-items: start; }
.rung .tier { justify-self: start; margin-top: 2px; }
.rung .chips .chip { font-size: 11.5px; padding: 2px 8px; }
.rung .chip.no { text-decoration: none; }

/* Monitors */
.mt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mt { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); min-width: 0; }
.radar { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--royal-50); color: var(--royal); display: grid; place-items: center; overflow: hidden; }
.radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(36,69,216,.30), transparent 28%); animation: sweep 3.4s linear infinite; }
.radar svg { position: relative; z-index: 1; }
.mt b { display: block; font-size: 13px; }
.mt small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Quality checks as tiles */
.ck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ck { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); align-content: start; min-width: 0; }
.ck-h { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; }
.ck-h .kic { width: 30px; height: 30px; border-radius: 9px; }
.ck-h b { font-size: 13px; line-height: 1.3; }
.ck-v { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.ck-v strong { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.ck-v strong.lo { color: var(--warn); }
.ck p { font-size: 12px; color: var(--muted); line-height: 1.4; }
.ck .fail { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink2); background: var(--sunken); border-radius: 8px; padding: 5px 8px; font-weight: 600; }
.ck .fail svg { color: var(--warn); flex: none; }

/* Semantic: why safer */
.safe-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.safe { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
.safe .kic { width: 34px; height: 34px; }
.safe b { display: block; font-size: 13px; }
.safe span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tokbar { display: grid; gap: 4px; margin-top: 6px; }
.tokbar div { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.tokbar i { display: block; height: 7px; border-radius: 4px; background: var(--bad); opacity: .65; }
.tokbar div + div i { background: var(--royal); opacity: 1; }
.steps.play .step b { display: flex; align-items: center; gap: 6px; }
.ans-pill { display: flex; width: fit-content; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--good); background: var(--good-bg); border-radius: 999px; padding: 3px 10px; }

@media (max-width: 1100px) { .mt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .th { grid-template-columns: minmax(0, 1fr); }
  .th-pick { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); overflow-x: auto; }
  .stn span { display: none; }
  .stn b { font-size: 10.5px; }
  .board, .mt-grid, .safe-grid, .qq { grid-template-columns: minmax(0, 1fr); }
  .hrow { grid-template-columns: 34px minmax(0, 1fr); }
  .hrow .when, .hrow .who { grid-column: 2; justify-items: start; }
  .th-stage { padding: 14px; }
  .paper-h { flex-wrap: wrap; }
  .paper-h > div { flex-basis: calc(100% - 50px); }
  .paper { padding: 14px; }
}

/* v9: plain-language ontology, semantic layer and engines */
.omap { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--sans); }
.omap .band { stroke: none; }
.omap .band.b0 { fill: #F1F4FE; } .omap .band.b1 { fill: #F5F6FA; } .omap .band.b2 { fill: #F3F2FA; }
.omap .band-t { font-size: 11px; font-weight: 800; letter-spacing: .1em; fill: var(--muted); }
.omap .e2 { fill: none; stroke: var(--line2); stroke-width: 1.6; transition: opacity .3s, stroke .3s; }
.omap .e2.hot { stroke: var(--royal); stroke-width: 2.2; }
.omap .e2.path { stroke: var(--royal); stroke-width: 3; stroke-dasharray: 6 5; animation: march .8s linear infinite; }
.omap .e2.fade, .omap .el2.fade { opacity: .25; }
.omap .el2 { font-size: 11.5px; font-weight: 700; fill: var(--muted); paint-order: stroke; stroke: #F5F6FA; stroke-width: 5px; stroke-linejoin: round; }
.omap .el2.hot { fill: var(--royal-d); }
.omap .n2 { cursor: pointer; color: var(--royal); transition: opacity .3s; }
.omap .n2 rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.3; transition: fill .3s, stroke .3s; filter: drop-shadow(0 2px 4px rgba(13,21,48,.06)); }
.omap .n2 .ib { fill: var(--royal-50); transition: fill .3s; }
.omap .n2.b1 { color: #4A5578; } .omap .n2.b1 .ib { fill: #ECEEF5; }
.omap .n2.b2 { color: #5B4BB7; } .omap .n2.b2 .ib { fill: #EEEBFB; }
.omap .nm2 { font-size: 13.5px; font-weight: 800; fill: var(--ink); }
.omap .ct2 { font-size: 11.5px; font-weight: 600; fill: var(--muted); }
.omap .n2:hover rect { stroke: var(--royal); }
.omap .n2.sel rect, .omap .n2.now rect { fill: var(--royal); stroke: var(--royal); }
.omap .n2.sel, .omap .n2.now { color: #fff; }
.omap .n2.sel .ib, .omap .n2.now .ib { fill: rgba(255,255,255,.18); }
.omap .n2.sel .nm2, .omap .n2.sel .ct2, .omap .n2.now .nm2, .omap .n2.now .ct2 { fill: #fff; }
.omap .n2.near rect, .omap .n2.lit rect { stroke: var(--royal); stroke-width: 1.8; }
.omap .n2.lit rect { fill: var(--royal-50); }
.omap .n2.fade { opacity: .28; }
.omap .n2.now rect { animation: glow 1.1s ease-in-out infinite; }
@keyframes march { to { stroke-dashoffset: -22; } }
@keyframes glow { 50% { filter: drop-shadow(0 0 10px rgba(36,69,216,.55)); } }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--sunken); }
.trail.idle { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; background: var(--royal-50); color: var(--ink2); font-size: 13.5px; }
.trail.idle svg { color: var(--royal); margin-top: 2px; }
.tn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px 5px 5px; font-size: 13px; font-weight: 700; animation: pop .4s both; }
.tn .kic { width: 26px; height: 26px; border-radius: 8px; }
.tn small { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.tverb { font-size: 11.5px; font-weight: 700; color: var(--royal-d); animation: fadein .4s both; }
.answer { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--good-bg); color: #0B5C3E; font-size: 14px; animation: rise .5s both; }
.ent2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.ent2 > div { display: grid; gap: 10px; align-content: start; min-width: 0; }
.ent2-a { grid-template-columns: 56px minmax(0, 1fr); }
.ent2-a > p, .ent2-a > .btn { grid-column: 1 / -1; justify-self: start; }
.ent2-def { font-size: 15.5px; color: var(--ink); line-height: 1.5; }
.big-ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--royal-50); color: var(--royal); flex: none; }
.big-ic.b1 { background: #ECEEF5; color: #4A5578; } .big-ic.b2 { background: #EEEBFB; color: #5B4BB7; }
.srcs2 { display: grid; gap: 8px; }
.src2 { border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; display: grid; gap: 7px; }
.src2-h { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 800; color: var(--ink2); }
.src2-h svg { color: var(--royal); }
.rels2 { display: grid; gap: 6px; }
.rel2 { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 7px 10px; font-size: 13px; color: var(--ink2); width: 100%; }
.rel2:hover { border-color: var(--royal-200); background: var(--royal-50); }
.rel2 b { color: var(--royal-d); }
.rel2 .kic { width: 28px; height: 28px; border-radius: 8px; }
/* Matching: four records become one customer */
.merge { display: grid; grid-template-columns: minmax(0, 1.25fr) 90px minmax(0, 1fr); gap: 0; align-items: stretch; }
.m-srcs { display: grid; gap: 10px; align-content: space-around; }
.m-src { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1.1fr repeat(3, minmax(0, 1fr)); gap: 10px; align-items: center; background: var(--surface); }

@media (prefers-reduced-motion: no-preference) {

}

/* architecture diagram */
.arch-wrap { position: relative; overflow-x: auto; }
.arch { width: 100%; min-width: 860px; display: block; }
.arch .lane { fill: var(--sunken); stroke: var(--line); }
.arch .lane-t { font: 800 10.5px var(--sans); letter-spacing: .08em; fill: var(--muted); text-transform: uppercase; }
.arch .cmp { cursor: pointer; }
.arch .cmp rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.2; transition: stroke .2s, fill .2s; }
.arch .cmp:hover rect, .arch .cmp:focus rect { stroke: var(--royal); fill: var(--royal-50); outline: none; }
.arch .cmp:focus { outline: none; }
.arch .cmp.on rect { stroke: var(--royal); stroke-width: 2; fill: var(--royal-50); }
.arch .cmp.hit rect { stroke: var(--royal); stroke-width: 2.4; fill: var(--royal-100); }
.arch .cmp.deny rect { stroke: var(--bad); stroke-width: 2.4; fill: var(--bad-bg); }
.arch .cmp text { font: 700 12px var(--sans); fill: var(--ink); pointer-events: none; }
.arch .cmp text.m { font: 500 10px var(--mono); fill: var(--muted); }
.arch .cmp.store rect { fill: #0E1838; stroke: #0E1838; } .arch .cmp.store text { fill: #fff; } .arch .cmp.store text.m { fill: #8FA6FF; }
.arch .cmp.store.on rect, .arch .cmp.store.hit rect { fill: #24357A; stroke: var(--royal-200); }
.arch .wire { fill: none; stroke: var(--line2); stroke-width: 1.6; marker-end: url(#archArrow); }
.arch .wire.hot { stroke: var(--royal); stroke-width: 2.4; stroke-dasharray: 6 5; animation: dash 0.8s linear infinite; }
.arch .wire.denied { stroke: var(--bad); stroke-width: 2.4; }
.arch .wire-t { font: 600 9.5px var(--mono); fill: var(--muted); }
.arch .pkt { fill: var(--royal); filter: drop-shadow(0 0 6px rgba(36,69,216,.6)); }
@keyframes dash { to { stroke-dashoffset: -22; } }
.arch-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.arch-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line2); background: var(--surface); }
.arch-legend i.st0 { background: #0E1838; border-color: #0E1838; }

/* request trace */
.scen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.scen button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 13px; display: grid; gap: 4px; min-width: 0; }
.scen button:hover { border-color: var(--royal-200); }
