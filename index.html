.scen .res { font-family: var(--mono); font-size: 11px; font-weight: 700; }
.scen .res.ok { color: var(--good); } .scen .res.bad { color: var(--bad); } .scen .res.unk { color: var(--unk); }
.wf { display: grid; gap: 4px; }
.wf-row { display: grid; grid-template-columns: minmax(200px, 1.15fr) minmax(0, 1.5fr) 118px; gap: 12px; align-items: center; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; opacity: .28; transition: opacity .25s, background .2s; }
.wf-row.done, .wf-row.cur { opacity: 1; }
.wf-row:hover { background: var(--sunken); }
.wf-row.sel { border-color: var(--royal-200); background: var(--royal-50); }
.wf-row .nm { display: flex; gap: 8px; align-items: center; min-width: 0; }
.wf-row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-row .svc { font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--sunken); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.wf-track { position: relative; height: 14px; background: var(--sunken); border-radius: 4px; }
.wf-bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; background: var(--royal); transform-origin: left; }
.wf-row.cur .wf-bar { animation: grow .5s ease-out; }
.wf-bar.pg { background: #2F6FD0; } .wf-bar.neo { background: #0F8F7E; } .wf-bar.audit { background: #6B4FD0; } .wf-bar.deny { background: var(--bad); } .wf-bar.unk { background: var(--unk); }
.wf-ms { font-family: var(--mono); font-size: 11px; text-align: right; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.wf-axis { display: grid; grid-template-columns: minmax(200px, 1.15fr) minmax(0, 1.5fr) 118px; gap: 12px; padding: 0 8px; font: 500 10px var(--mono); color: var(--faint); }
.wf-axis div { display: flex; justify-content: space-between; }
.verdict { display: flex; gap: 12px; align-items: center; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; flex-wrap: wrap; }
.verdict.ok { background: var(--good-bg); color: #0B5C3E; } .verdict.bad { background: var(--bad-bg); color: #7A1C25; } .verdict.unk { background: var(--unk-bg); color: #343A63; }
.verdict .mono { font-size: 12px; }

/* trust: tamper demo + threat table */
.tchain { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.tev { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 3px; font-size: 11px; background: var(--surface); min-width: 0; position: relative; transition: border-color .25s, background .25s; }
.tev b { font-size: 12px; } .tev .mono { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tev .lbl { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tev.ok { border-color: #9AD8BA; background: var(--good-bg); }
.tev.bad { border-color: #EFA1A8; background: var(--bad-bg); }
.tev.tampered .lbl { color: var(--bad); font-weight: 700; }
.tev.checking { border-color: var(--royal); box-shadow: 0 0 0 3px var(--royal-100); }
.tev button { justify-self: start; margin-top: 3px; font-size: 10.5px; padding: 2px 7px; }
.threat td:first-child { min-width: 180px; } .threat td { font-size: 12.5px; }
.lim { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lim div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 3px; background: var(--surface); }
.lim strong { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.lim span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.honest { border: 1px dashed var(--line2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; background: var(--surface); }
.honest h3 { font-size: 14px; }
.state-m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font: 600 11.5px var(--mono); }
.state-m span { border: 1px solid var(--line2); border-radius: 7px; padding: 3px 8px; background: var(--surface); }
.state-m span.end { border-color: #9AD8BA; background: var(--good-bg); }
.state-m span.fail { border-color: #EFA1A8; background: var(--bad-bg); }
.state-m i { color: var(--faint); font-style: normal; }
.uth .state-m span { background: #121E4A; border-color: #24357A; color: #DCE3FF; }
.uth .state-m span.end { background: rgba(94,209,155,.12); border-color: #2E7D5B; } .uth .state-m span.fail { background: rgba(255,138,148,.12); border-color: #8A3640; }

@media (max-width: 1100px) { .scen { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lim { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tchain { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .uth-grid { grid-template-columns: minmax(0, 1fr); }
  .uth-tabs { margin-left: 0; }
  .scen { grid-template-columns: minmax(0, 1fr); }
  .wf-row, .wf-axis { grid-template-columns: minmax(0, 1fr) 104px; }
  .wf-row .wf-track, .wf-axis > div:nth-child(2) { display: none; }
  .tchain { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lim { grid-template-columns: minmax(0, 1fr); }
  .eng-btn span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .arch .wire.hot { animation: none; } .wf-row.cur .wf-bar { animation: none; } }
details.qa { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
details.qa summary { cursor: pointer; font-size: 13px; }
details.qa[open] { border-color: var(--royal-100); background: var(--royal-50); }
.why { display: grid; gap: 3px; padding: 10px 0; border-bottom: 1px solid var(--line); } .why:last-child { border-bottom: 0; } .why b { font-size: 13.5px; } .why .sub { color: var(--ink2); line-height: 1.5; }
.uth .verdict b { color: inherit; }
.verdict > span { flex: 1; min-width: 220px; }
/* ---------- v12: contrast, dark theme, command palette, shortcuts, copy, tooltips, Ask Glass, failure lab, print ---------- */
:root { --muted: #555E7B; --faint: #626B88; --good: #0C7450; --fill: #2445D8; --fill-d: #1A33A8; --top-bg: rgba(244,246,251,.86); --scrim: rgba(13,21,48,.32); --code-dark: #0E1838; --kbd: #FFFFFF; }
.code .s { color: #0C7450; } .code .n { color: #A04A15; }
.kpi.accent .v > span[style*="opacity"] { opacity: .9 !important; }
.av[style*="E2A23B"] { color: #3A2600 !important; }
.top { background: var(--top-bg); }
.scrim { background: var(--scrim); }
.btn.primary, .kpi.accent, .stage.dark, .tour .btn.primary { background: var(--fill); border-color: var(--fill); }
.btn.primary:hover { background: var(--fill-d); border-color: var(--fill-d); }

/* dark theme: tokens first, then the few surfaces that used fixed light colours */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark; --bg: #0A0F1E; --surface: #111829; --sunken: #161E33; --ink: #E8ECF8; --ink2: #BAC3DC; --muted: #8F99B7; --faint: #8A94B2; --line: #222B42; --line2: #2F3956;
  --royal: #7C94FF; --royal-d: #A9B9FF; --royal-50: #172042; --royal-100: #22305E; --royal-200: #3A4C8C; --fill: #3A55DD; --fill-d: #2E47C4;
  --good: #4FD199; --good-bg: #0F2A21; --warn: #F2B85B; --warn-bg: #2E2410; --bad: #FF7B86; --bad-bg: #34161B; --unk: #AEB4D8; --unk-bg: #1D2238;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 28px 70px -20px rgba(0,0,0,.75);
  --top-bg: rgba(10,15,30,.82); --scrim: rgba(0,0,0,.55); --code-dark: #070B17; --kbd: #1A2238;
} }
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #0A0F1E; --surface: #111829; --sunken: #161E33; --ink: #E8ECF8; --ink2: #BAC3DC; --muted: #8F99B7; --faint: #8A94B2; --line: #222B42; --line2: #2F3956;
  --royal: #7C94FF; --royal-d: #A9B9FF; --royal-50: #172042; --royal-100: #22305E; --royal-200: #3A4C8C; --fill: #3A55DD; --fill-d: #2E47C4;
  --good: #4FD199; --good-bg: #0F2A21; --warn: #F2B85B; --warn-bg: #2E2410; --bad: #FF7B86; --bad-bg: #34161B; --unk: #AEB4D8; --unk-bg: #1D2238;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg: 0 28px 70px -20px rgba(0,0,0,.75);
  --top-bg: rgba(10,15,30,.82); --scrim: rgba(0,0,0,.55); --code-dark: #070B17; --kbd: #1A2238;
}
/* selectors shared by both dark triggers, scoped with a class set on <html> by the theme code */
html.dk .code.dark, html.dk .tour, html.dk .toast, html.dk .role-bar { background: var(--code-dark); border: 1px solid var(--line2); }
html.dk .code .s { color: #7FDDB0; } html.dk .code .n { color: #FFB27A; } html.dk .code .k { color: #9DB0FF; }
html.dk .uth { background: #0B1226; border-color: var(--line2); }
html.dk .banner.bad { color: #FFC2C7; border-color: #5A2730; }
html.dk .verdict.ok { color: #9FE8C6; } html.dk .verdict.bad { color: #FFC2C7; } html.dk .verdict.unk { color: #D4D8F0; }
html.dk .chip.no { border-color: #5A2730; }
html.dk .btn.danger { border-color: #5A2730; }
html.dk .blk.ok, html.dk .tev.ok { border-color: #2E7D5B; }
html.dk .tev.bad { border-color: #8A3640; }
html.dk .arch .cmp.store rect { fill: #24305C; stroke: #3A4C8C; }
html.dk img, html.dk .brand-logo { filter: none; }

/* company logo slot */
.co-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.company .co-logo { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 4px 10px -4px var(--c2); }
.co-row > span:last-child { display: grid; min-width: 0; }
.co-row b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* top bar additions */
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); }
.icon-btn:hover { border-color: var(--royal-200); background: var(--royal-50); color: var(--royal-d); }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--muted); padding: 0 8px 0 11px; font-size: 13px; font-weight: 600; min-width: 190px; }
.search-btn:hover { border-color: var(--royal-200); color: var(--ink2); }
.search-btn kbd { margin-left: auto; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; font: 600 11px var(--mono); color: var(--ink2); background: var(--kbd); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; }

/* command palette and shortcut sheet */
.cmdk-scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); backdrop-filter: blur(3px); display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; animation: fadeIn .14s ease-out; }
.cmdk { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: min(560px, 76vh); animation: popIn .16s ease-out; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.cmdk-in input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font: 600 16px var(--sans); color: var(--ink); }
.cmdk-in input::placeholder { color: var(--faint); font-weight: 500; }
.cmdk-list { overflow-y: auto; padding: 6px; }
.cmdk-g { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; }
.cmdk-it { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.cmdk-it .ci { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--sunken); color: var(--muted); }
.cmdk-it b { font-size: 13.5px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-it span.s2 { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-it mark { background: none; color: var(--royal-d); }
.cmdk-it.on { background: var(--royal-50); }
.cmdk-it.on .ci { background: var(--fill); color: #fff; }
.cmdk-it .go { font-size: 11px; color: var(--faint); font-weight: 700; }
.cmdk-empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.cmdk-foot { display: flex; gap: 16px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); background: var(--sunken); }
.cmdk-foot span { display: inline-flex; gap: 5px; align-items: center; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 22px; padding: 14px 18px 18px; overflow-y: auto; }
.keys h3 { grid-column: 1 / -1; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-top: 8px; }
.keys div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.keys div span:last-child { display: inline-flex; gap: 4px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

/* copy buttons on code */
.code, .mcp-call, .formula { position: relative; }
.cp-btn { position: absolute; top: 8px; right: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; font: 700 11px var(--sans); padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); opacity: 0; transition: opacity .15s; }
.code:hover > .cp-btn, .mcp-call:hover > .cp-btn, .formula:hover > .cp-btn, .cp-btn:focus-visible, .cp-btn.done { opacity: 1; }
.code.dark > .cp-btn, .mcp-call > .cp-btn { background: #1A2550; border-color: #2E3D7A; color: #DCE3FF; }
.cp-btn.done { color: var(--good); }
@media (hover: none) { .cp-btn { opacity: 1; } }

/* tooltip */
.tip { position: fixed; z-index: 70; max-width: 280px; pointer-events: none; background: var(--code-dark); color: #E8ECF8; font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
html:not(.dk) .tip { background: #0E1838; }
.tip.show { opacity: 1; transform: none; }
.tip b { color: #fff; display: block; margin-bottom: 2px; }

/* skeleton */
.skel { display: grid; gap: 22px; align-content: start; }
.skel-ov { position: fixed; right: 0; bottom: 0; z-index: 19; background: var(--bg); padding: 28px 32px; transition: opacity .2s; }
.skel-ov.out { opacity: 0; }
.sk { border-radius: 12px; background: linear-gradient(90deg, var(--sunken) 0%, var(--line) 50%, var(--sunken) 100%); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .cmdk-scrim, .cmdk { animation: none; } }

/* failure lab banner */
.fail-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-radius: 12px; padding: 10px 14px; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); color: var(--ink); font-size: 13px; }
.fail-bar .fb-t { font-weight: 800; color: var(--warn); display: inline-flex; gap: 6px; align-items: center; }
.fail-bar .fb-i { display: inline-flex; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font-weight: 600; font-size: 12px; }
.fail-bar .fb-i button { border: 0; background: var(--sunken); border-radius: 999px; font: 700 11px var(--sans); padding: 2px 8px; color: var(--royal-d); }
.flab { display: grid; gap: 8px; }
.flab-it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.flab-it.on { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-bg); }
.flab-it b { font-size: 13px; } .flab-it span { grid-column: 1; font-size: 12px; color: var(--muted); }
.flab-it .toggle { grid-row: 1 / span 2; grid-column: 2; }
.arch .cmp.down rect { stroke: var(--bad); stroke-width: 2.4; stroke-dasharray: 5 4; }
.arch .cmp.down text:not(.m) { fill: var(--bad); }

/* Ask Glass */
.ask-box { display: grid; gap: 12px; }
.ask-in { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line2); background: var(--surface); border-radius: 14px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.ask-in:focus-within { border-color: var(--royal); box-shadow: 0 0 0 4px var(--royal-100); }
.ask-in input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font: 600 16px var(--sans); color: var(--ink); padding: 8px 0; }
.ask-in input::placeholder { color: var(--faint); font-weight: 500; }
.ask-opts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.ask-opt { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg2 { display: inline-flex; background: var(--sunken); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg2 button { border: 0; background: none; border-radius: 7px; padding: 5px 10px; font: 700 12px var(--sans); color: var(--ink2); }
.seg2 button.on { background: var(--surface); color: var(--royal-d); box-shadow: 0 1px 3px rgba(13,21,48,.12); }
.asof { display: inline-flex; align-items: center; gap: 10px; }
.asof input[type=range] { width: 170px; accent-color: var(--royal); }
.asof output { font: 700 12px var(--mono); color: var(--ink); min-width: 92px; }
.sugg { display: flex; gap: 8px; flex-wrap: wrap; }
.sugg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 600 12.5px var(--sans); color: var(--ink2); text-align: left; }
.sugg button:hover { border-color: var(--royal-200); color: var(--royal-d); background: var(--royal-50); }
.pipe2 { display: grid; gap: 2px; }
.p2 { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 13px; opacity: .35; transition: opacity .2s; }
.p2.done, .p2.cur { opacity: 1; }
.p2 i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--muted); }
.p2.done i { background: var(--good-bg); color: var(--good); } .p2.fail i { background: var(--bad-bg); color: var(--bad); } .p2.hold i { background: var(--unk-bg); color: var(--unk); } .p2.skip i { background: var(--sunken); color: var(--faint); }
.p2.cur i { background: var(--royal-50); color: var(--royal); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.p2 small { font: 600 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.p2.fail small { color: var(--bad); } .p2.hold small { color: var(--unk); }
.ans-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ans-big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ans-big small { font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.ans-delta { font: 700 12px var(--mono); }
.ans-bars { display: grid; gap: 8px; }
.ans-bar { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.ans-bar .t { height: 12px; background: var(--sunken); border-radius: 6px; overflow: hidden; }
.ans-bar .t i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--fill), var(--royal)); transform-origin: left; animation: grow .6s ease-out both; }
.ans-bar .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.hid { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px var(--mono); color: var(--unk); background: var(--unk-bg); border-radius: 5px; padding: 1px 6px; }
.cites { display: flex; gap: 6px; flex-wrap: wrap; }

function xBars(labels, sets, o = {}) {

  const bw = iw / n, gx = i => P.l + i * bw, y = v => P.t + ih - v / max * ih;

  const t = e.target.closest('[data-cmdk],[data-themeset],[data-themecycle],[data-share],[data-print],[data-keys],[data-motion]'); if (!t) return;
  const d = t.dataset;
  if (d.cmdk !== undefined) cmdOpen();
  else if (d.themeset) { setTheme(d.themeset); togglePop(false); }
  else if (d.themecycle !== undefined) cycleTheme();
  else if (d.share !== undefined) shareLink();
  else if (d.print !== undefined) { togglePop(false); setTimeout(() => window.print(), 80); }
  else if (d.keys !== undefined) { togglePop(false); openKeys(); }
  else if (d.motion !== undefined) setPaused(!S.paused);
});
if (S.eng) { const b = $('#engBtn'); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
paintMotion();
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('th-log')) S.libLogOpen = e.target.open; }, true);
</script>

</body></html>
